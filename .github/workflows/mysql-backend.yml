name: MySQL Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/db_mysql/**'
      - 'src/lib/db_sqlite/**'
      - 'src/lib/db/**'
      - 'src/lib/server/server_config.*'
      - 'tools/common/database.py'
      - 'tools/cluster_control/**'
      - 'CMakeLists.txt'
      - 'src/server/dbapp/**'
      - 'src/server/baseapp/**'
      - 'tests/integration/test_dbapp_checkout_cleanup.cpp'
      - 'tests/integration/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - 'tests/unit/test_mysql_database.cpp'
      - 'tests/unit/CMakeLists.txt'
      - 'cmake/Dependencies.cmake'
      - 'cmake/AtlasMySQL.cmake'
      - 'tools/prepare_mysql.py'
      - 'tools/test_mysql.py'
      - 'cmake/AtlasRuntimeDeploy.cmake'
      - '.github/workflows/mysql-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/db_mysql/**'
      - 'src/lib/db_sqlite/**'
      - 'src/lib/db/**'
      - 'src/lib/server/server_config.*'
      - 'tools/common/database.py'
      - 'tools/cluster_control/**'
      - 'CMakeLists.txt'
      - 'src/server/dbapp/**'
      - 'src/server/baseapp/**'
      - 'tests/integration/test_dbapp_checkout_cleanup.cpp'
      - 'tests/integration/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - 'tests/unit/test_mysql_database.cpp'
      - 'cmake/Dependencies.cmake'
      - 'cmake/AtlasMySQL.cmake'
      - 'tools/prepare_mysql.py'
      - 'tools/test_mysql.py'
      - 'cmake/AtlasRuntimeDeploy.cmake'
      - '.github/workflows/mysql-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql:
    name: Oracle MySQL 8.4.13 TLS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install GCC 13 + Ninja + OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build libssl-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100

      - name: Build pinned OpenSSL SDK
        run: python tools/build_openssl.py --config Debug

      - name: Prepare pinned Oracle MySQL SDK and source
        run: python tools/prepare_mysql.py

      - name: Configure
        run: cmake --preset debug -DATLAS_DB_MYSQL=ON

      - name: Build MySQL backend and DBApp tests
        run: cmake --build build/debug --config Debug --target test_mysql_database test_dbapp_checkout_cleanup atlas_db_mysql_plugin --parallel 2

      - name: Run MySQL backend and DBApp contracts
        run: >-
          python tools/test_mysql.py --docker --
          ctest --test-dir build/debug --build-config Debug
          -R "^(test_mysql_database|test_dbapp_checkout_cleanup)$"
          --output-on-failure --no-tests=error
