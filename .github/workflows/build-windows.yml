name: Windows Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tools/profile/**'
      - 'tools/cluster_control/**'
      - '.gitignore'
      - 'memory/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tools/profile/**'
      - 'tools/cluster_control/**'
      - '.gitignore'
      - 'memory/**'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            config: Debug
          - preset: profile
            config: RelWithDebInfo
          - preset: release
            config: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup MSVC environment
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022
          toolset: 14.44

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: .sccache
          key: sccache-windows-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            sccache-windows-${{ matrix.preset }}-

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-windows-

      - name: Restore .NET packages
        shell: bash
        run: |
          shopt -s globstar nullglob
          for proj in src/**/*.csproj tests/**/*.csproj samples/**/*.csproj; do
            dotnet restore "$proj"
          done

      - name: Build pinned OpenSSL SDK
        run: python tools/build_openssl.py --config ${{ matrix.config == 'Debug' && 'Debug' || 'Release' }}

      - name: Prepare pinned Oracle MySQL SDK and source
        run: python tools/prepare_mysql.py

      - name: Configure
        env:
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || 'Unix Makefiles' }}
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: >
          python tools/build.py ${{ matrix.preset }} --config-only
          --cmake-arg=-DCMAKE_C_COMPILER_LAUNCHER=sccache
          --cmake-arg=-DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          --cmake-arg=-DATLAS_BUILD_TESTS=OFF

      - name: Build
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }}

      - name: sccache stats
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: sccache --show-stats
