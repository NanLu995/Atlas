name: Windows MySQL Tests

# Runs after a successful Windows Build and rebuilds debug for test binaries.
# sccache should make the rebuild incremental instead of a full compile.
on:
  workflow_run:
    workflows: ["Windows Build"]
    types: [completed]

concurrency:
  group: tests-windows-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup MSVC environment
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022
          toolset: 14.44

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: .sccache
          key: sccache-windows-debug-${{ github.event.workflow_run.head_sha }}
          restore-keys: |
            sccache-windows-debug-

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-windows-

      - name: Restore .NET packages
        shell: bash
        run: |
          shopt -s globstar nullglob
          for proj in src/**/*.csproj tests/**/*.csproj samples/**/*.csproj; do
            dotnet restore "$proj"
          done

      - name: Build pinned OpenSSL SDK
        run: python tools/build_openssl.py --config Debug

      - name: Prepare Oracle MySQL SDK
        run: python tools/prepare_mysql.py

      - name: Configure
        env:
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || 'Unix Makefiles' }}
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        # ATLAS_BUILD_NET_CLIENT=ON pulls in atlas_test_helpers, the
        # P/Invoke surface for the Atlas.Client.IntegrationTests step below.
        run: >
          python tools/build.py debug --config-only
          --cmake-arg=-DCMAKE_C_COMPILER_LAUNCHER=sccache
          --cmake-arg=-DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          --cmake-arg=-DATLAS_BUILD_NET_CLIENT=ON
          --cmake-arg=-DATLAS_DB_MYSQL=ON

      - name: Build
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: cmake --build build/debug --config Debug

      - name: sccache stats
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: sccache --show-stats

      - name: Unit Tests
        working-directory: build/debug
        run: ctest --build-config Debug --label-regex unit -LE mysql --output-on-failure --no-tests=error

      - name: Integration Tests
        working-directory: build/debug
        run: ctest --build-config Debug --label-regex integration -LE mysql --output-on-failure --no-tests=error

      - name: MySQL backend and integration contracts
        run: python tools/test_mysql.py -- ctest --test-dir build/debug -C Debug -L mysql --output-on-failure --no-tests=error

      - name: C# Unit Tests
        run: ctest --test-dir build/debug -C Debug --label-regex managed --output-on-failure --no-tests=error

      - name: Real MySQL login
        run: python tools/test_mysql.py -- python tools/verify_real_login.py --build debug

      - name: C# IntegrationTests
        env:
          ATLAS_BIN_DIR: ${{ github.workspace }}/bin/debug
        run: python tools/test_mysql.py -- dotnet test tests/csharp/Atlas.Client.IntegrationTests --filter "Category!=Nightly" --nologo
